input {
  tcp {
    port => 5000
    codec => json_lines
  }

  # Alternative: Using HTTP input
  http {
    port => 8080
    codec => json
  }
}

filter {
  # Parse JSON log
  if [message] =~ /^\{.*\}$/ {
    json {
      source => "message"
    }
  }

  # Add timestamp
  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

  # Extract service name
  if [logger_name] {
    grok {
      match => { "logger_name" => "^(?<service_package>[a-zA-Z0-9.]+)" }
    }
  }

  # Add tags for better filtering
  if [level] == "ERROR" {
    mutate {
      add_tag => ["error"]
    }
  }

  # Ensure trace ID and span ID are properly indexed for correlation
  if [traceId] {
    mutate {
      add_tag => ["traced"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "microservices-logs-%{+YYYY.MM.dd}"
    document_type => "_doc"
  }

  # Debug output (optional)
  stdout {
    codec => rubydebug
  }
}