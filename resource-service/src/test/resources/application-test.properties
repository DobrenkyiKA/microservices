# Test profile configuration with H2 in-memory database
spring.application.name=resource-service

# H2 Database configuration for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate configuration for testing
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable Spring Cloud Config for tests
spring.cloud.config.enabled=false
spring.cloud.bootstrap.enabled=false

# Storage Service configuration
storage.service.name=storage-service

# Resilience4j Circuit Breaker configuration
resilience4j.circuitbreaker.instances.storageService.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.storageService.slidingWindowSize=10
resilience4j.circuitbreaker.instances.storageService.minimumNumberOfCalls=3
resilience4j.circuitbreaker.instances.storageService.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.storageService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.storageService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.storageService.eventConsumerBufferSize=10

# AWS S3 configuration for testing (mock values)
cloud.aws.credentials.access-key=test-access-key
cloud.aws.credentials.secret-key=test-secret-key
cloud.aws.region.static=us-east-1
spring.cloud.aws.endpoint=http://localhost:4566