spring.application.name=resource-service
spring.cloud.config.uri=${SPRING_CLOUD_CONFIG_URI:http://localhost:8888}
spring.cloud.config.fail-fast=true
spring.cloud.config.retry.max-attempts=10
spring.cloud.config.retry.initial-interval=1000

# Default profile (can be overridden by environment variable)
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
logstash.server.uri=${LOGSTASH_SERVER:localhost:5010}

# OAuth2 Client (client-credentials) for outbound calls fallback
spring.security.oauth2.client.registration.service-client.client-id=${OAUTH_CLIENT_ID:service-client}
spring.security.oauth2.client.registration.service-client.client-secret=${OAUTH_CLIENT_SECRET:service-secret}
spring.security.oauth2.client.registration.service-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.service-client.scope=read,write
spring.security.oauth2.client.registration.service-client.provider=auth-server
spring.security.oauth2.client.provider.auth-server.token-uri=${OAUTH_TOKEN_URI:http://localhost:9000/oauth2/token}

# Enable Micrometer Observation for Kafka (producer + listener) to propagate tracing headers
spring.kafka.template.observation-enabled=true
spring.kafka.listener.observation-enabled=true