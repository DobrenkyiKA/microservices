spring.application.name=resource-service
song.service.application.name=song-service

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/resource-db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# Hibernate (turning off for transition to a containerized database setup)
spring.jpa.hibernate.ddl-auto=none

# Limit consuming file/request size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Exclude stack trace for error responses
server.error.include-stacktrace=on_param
server.error.whitelabel.enabled=false
server.error.include-message=on_param

server.port=8081

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:http://localhost:9092}
resource.kafka.topic=${RESOURCE_CREATED_TOPIC:resource-created}

# Eureka
eureka.client.serviceUrl.defaultZone=${EUREKA_CLIENT_SERVICE_URL:http://localhost:8761/eureka}
eureka.instance.home-page-url-path=/resources/

# Cloud (Localstack/AWS S3)
spring.cloud.aws.endpoint=${LOCALSTACK_SERVICE_URL:http://localhost:4566}
cloud.aws.credentials.access-key=your-access-key
cloud.aws.credentials.secret-key=your-secret-key
cloud.aws.region.static=us-east-1
cloud.aws.s3.bucket=songs
